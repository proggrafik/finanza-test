<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Financiero</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #252545;
  --text: #e8e8f0;
  --text2: #9a9ab0;
  --green: #00e676;
  --red: #ff5252;
  --blue: #448aff;
  --accent: #7c4dff;
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.container { max-width: 900px; width: 100%; }
h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
h1 span { color: var(--accent); }
.resumen {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px; margin-bottom: 24px;
}
.card {
  background: var(--surface); border-radius: var(--radius);
  padding: 18px 20px; transition: transform .2s;
}
.card:hover { transform: translateY(-2px); }
.card .label { font-size: .8rem; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.card .valor { font-size: 1.6rem; font-weight: 700; margin-top: 6px; }
.card .valor.positivo { color: var(--green); }
.card .valor.negativo { color: var(--red); }
.card .valor.neutral { color: var(--blue); }
.grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 20px; margin-bottom: 24px;
}
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.form-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 20px;
}
.form-card h2 { font-size: 1rem; margin-bottom: 16px; color: var(--text2); }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: .8rem; color: var(--text2); margin-bottom: 4px; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 10px 12px;
  background: var(--surface2); border: 1px solid transparent;
  border-radius: 8px; color: var(--text); font-size: .9rem;
  outline: none; transition: border .2s;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
  border-color: var(--accent);
}
.form-row textarea { resize: vertical; min-height: 50px; font-family: inherit; }
.form-row-inline { display: flex; gap: 12px; }
.form-row-inline > * { flex: 1; }
.btn {
  width: 100%; padding: 11px;
  border: none; border-radius: 8px;
  font-size: .9rem; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.filtros {
  display: flex; gap: 10px; margin-bottom: 14px;
  flex-wrap: wrap;
}
.filtros select, .filtros input {
  padding: 8px 12px; background: var(--surface2);
  border: 1px solid transparent; border-radius: 8px;
  color: var(--text); font-size: .85rem; outline: none;
  flex: 1; min-width: 120px;
}
.filtros select:focus, .filtros input:focus { border-color: var(--accent); }
.transacciones { background: var(--surface); border-radius: var(--radius); padding: 20px; }
.transacciones h2 { font-size: 1rem; margin-bottom: 16px; color: var(--text2); }
.lista { display: flex; flex-direction: column; gap: 8px; }
.item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; background: var(--surface2);
  border-radius: 8px; transition: background .2s;
  gap: 10px;
}
.item:hover { background: #2e2e52; }
.item-izq { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.item-categoria {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.cat-ingreso { background: rgba(0,230,118,.15); }
.cat-gasto { background: rgba(255,82,82,.15); }
.item-info { min-width: 0; }
.item-desc { font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-fecha { font-size: .75rem; color: var(--text2); }
.item-monto { font-weight: 600; white-space: nowrap; }
.item-monto.ingreso { color: var(--green); }
.item-monto.gasto { color: var(--red); }
.item-accion {
  background: none; border: none; color: var(--text2);
  cursor: pointer; font-size: 1.1rem; padding: 4px;
  transition: color .2s; flex-shrink: 0;
}
.item-accion:hover { color: var(--red); }
.vacio { text-align: center; padding: 30px; color: var(--text2); }
.eliminar-todo {
  text-align: right; margin-top: 12px;
}
.eliminar-todo button {
  background: none; border: none; color: var(--red);
  font-size: .8rem; cursor: pointer; opacity: .6;
}
.eliminar-todo button:hover { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <h1><span>&#9670;</span> Control Financiero</h1>

  <div class="resumen">
    <div class="card"><div class="label">Balance Total</div><div class="valor neutral" id="balance">$0</div></div>
    <div class="card"><div class="label">Ingresos</div><div class="valor positivo" id="totalIngresos">$0</div></div>
    <div class="card"><div class="label">Gastos</div><div class="valor negativo" id="totalGastos">$0</div></div>
  </div>

  <div class="grid">
    <div class="form-card">
      <h2>Nueva Transacci&oacute;n</h2>
      <form id="formulario">
        <div class="form-row">
          <label>Tipo</label>
          <select id="tipo">
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
          </select>
        </div>
        <div class="form-row-inline">
          <div class="form-row" style="flex:1">
            <label>Categor&iacute;a</label>
            <select id="categoria"></select>
          </div>
          <div class="form-row" style="flex:1">
            <label>Monto</label>
            <input type="number" id="monto" step="0.01" min="0.01" required placeholder="0.00">
          </div>
        </div>
        <div class="form-row">
          <label>Descripci&oacute;n</label>
          <input type="text" id="descripcion" placeholder="Ej: Sueldo, supermercado..." maxlength="100">
        </div>
        <div class="form-row">
          <label>Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <button type="submit" class="btn btn-primary">Agregar</button>
      </form>
    </div>

    <div class="form-card">
      <h2>Estad&iacute;sticas</h2>
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--text2);margin-bottom:4px">
          <span>Ingresos</span><span id="pctIngreso">0%</span>
        </div>
        <div style="height:8px;background:var(--surface2);border-radius:4px;overflow:hidden">
          <div id="barraIngreso" style="height:100%;width:0%;background:var(--green);border-radius:4px;transition:width .4s"></div>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--text2);margin-bottom:4px">
          <span>Gastos</span><span id="pctGasto">0%</span>
        </div>
        <div style="height:8px;background:var(--surface2);border-radius:4px;overflow:hidden">
          <div id="barraGasto" style="height:100%;width:0%;background:var(--red);border-radius:4px;transition:width .4s"></div>
        </div>
      </div>
      <div style="font-size:.85rem;color:var(--text2);margin-top:16px" id="infoTransacciones">
        0 transacciones registradas
      </div>
    </div>
  </div>

  <div class="transacciones">
    <h2>Historial</h2>
    <div class="filtros">
      <select id="filtroTipo">
        <option value="todas">Todas</option>
        <option value="ingreso">Ingresos</option>
        <option value="gasto">Gastos</option>
      </select>
      <select id="filtroCategoria">
        <option value="todas">Todas las categor&iacute;as</option>
      </select>
      <input type="text" id="filtroBusqueda" placeholder="Buscar...">
    </div>
    <div id="listaTransacciones" class="lista">
      <div class="vacio">No hay transacciones registradas</div>
    </div>
    <div class="eliminar-todo">
      <button id="btnEliminarTodo">Eliminar todo</button>
    </div>
  </div>
</div>

<script>
const CATEGORIAS = {
  ingreso: ['Salario', 'Freelance', 'Inversiones', 'Ventas', 'Otro ingreso'],
  gasto: ['Alimentaci&oacute;n', 'Transporte', 'Servicios', 'Alquiler', 'Salud', 'Ocio', 'Educaci&oacute;n', 'Ropa', 'Otro gasto']
};

const ICONOS = {
  'Salario': '&#x1F4B0;', 'Freelance': '&#x1F4BB;', 'Inversiones': '&#x1F4C8;', 'Ventas': '&#x1F4E6;', 'Otro ingreso': '&#x1F4B5;',
  'Alimentaci&oacute;n': '&#x1F354;', 'Transporte': '&#x1F698;', 'Servicios': '&#x1F4A1;', 'Alquiler': '&#x1F3E0;',
  'Salud': '&#x2764;&#xFE0F;', 'Ocio': '&#x1F3B5;', 'Educaci&oacute;n': '&#x1F4DA;', 'Ropa': '&#x1F455;', 'Otro gasto': '&#x1F4B8;'
};

function api(path, opts) {
  return fetch('/api' + path, opts).then(r => { if (!r.ok) throw new Error(); return r.json(); });
}

function llenarCategorias(tipo) {
  const sel = document.getElementById('categoria');
  sel.innerHTML = CATEGORIAS[tipo || 'gasto'].map(c =>
    `<option value="${c}">${c}</option>`
  ).join('');
}

function formatearFecha(f) {
  const d = new Date(f + 'T00:00:00');
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function renderizar() {
  const tipo = document.getElementById('filtroTipo').value;
  const cat = document.getElementById('filtroCategoria').value;
  const busq = document.getElementById('filtroBusqueda').value;
  const params = new URLSearchParams();
  if (tipo !== 'todas') params.set('tipo', tipo);
  if (cat !== 'todas') params.set('categoria', cat);
  if (busq) params.set('busqueda', busq);

  api('/transacciones?' + params.toString()).then(data => {
    const cont = document.getElementById('listaTransacciones');
    if (!data.length) {
      cont.innerHTML = '<div class="vacio">No se encontraron transacciones</div>';
      return;
    }
    cont.innerHTML = data.map(t => {
      const esIngreso = t.tipo === 'ingreso';
      const icon = ICONOS[t.categoria] || '&#x1F4B5;';
      return `<div class="item">
        <div class="item-izq">
          <div class="item-categoria ${esIngreso ? 'cat-ingreso' : 'cat-gasto'}">${icon}</div>
          <div class="item-info">
            <div class="item-desc">${t.descripcion || t.categoria}</div>
            <div class="item-fecha">${t.categoria} &middot; ${formatearFecha(t.fecha)}</div>
          </div>
        </div>
        <div class="item-monto ${t.tipo}">${esIngreso ? '+' : '-'}$${Number(t.monto).toFixed(2)}</div>
        <button class="item-accion" data-id="${t.id}" title="Eliminar">&times;</button>
      </div>`;
    }).join('');
    cont.querySelectorAll('.item-accion').forEach(btn => {
      btn.addEventListener('click', () => eliminar(btn.dataset.id));
    });
  });
}

function actualizarResumen() {
  api('/resumen').then(r => {
    document.getElementById('balance').textContent = (r.balance < 0 ? '-' : '') + '$' + Math.abs(r.balance).toFixed(2);
    document.getElementById('balance').className = 'valor ' + (r.balance > 0 ? 'positivo' : r.balance < 0 ? 'negativo' : 'neutral');
    document.getElementById('totalIngresos').textContent = '$' + r.ingresos.toFixed(2);
    document.getElementById('totalGastos').textContent = '$' + r.gastos.toFixed(2);

    const total = r.ingresos + r.gastos;
    const pctI = total ? (r.ingresos / total * 100) : 0;
    const pctG = total ? (r.gastos / total * 100) : 0;
    document.getElementById('pctIngreso').textContent = pctI.toFixed(0) + '%';
    document.getElementById('pctGasto').textContent = pctG.toFixed(0) + '%';
    document.getElementById('barraIngreso').style.width = pctI + '%';
    document.getElementById('barraGasto').style.width = pctG + '%';
    document.getElementById('infoTransacciones').textContent =
      r.total + ' transaccion' + (r.total !== 1 ? 'es' : '') + ' registradas';
  });
}

function cargarFiltroCategorias() {
  api('/categorias').then(cats => {
    const sel = document.getElementById('filtroCategoria');
    sel.innerHTML = '<option value="todas">Todas las categor&iacute;as</option>' +
      cats.map(c => `<option value="${c}">${c}</option>`).join('');
  });
}

function cargarTodo() {
  Promise.all([
    actualizarResumen(),
    cargarFiltroCategorias(),
    renderizar()
  ]);
}

function eliminar(id) {
  if (!confirm('Eliminar esta transacci&oacute;n?')) return;
  api('/transacciones/' + id, { method: 'DELETE' }).then(cargarTodo);
}

document.getElementById('formulario').addEventListener('submit', e => {
  e.preventDefault();
  const tipo = document.getElementById('tipo').value;
  const categoria = document.getElementById('categoria').value;
  const monto = parseFloat(document.getElementById('monto').value);
  const descripcion = document.getElementById('descripcion').value.trim() || categoria;
  const fecha = document.getElementById('fecha').value;

  if (!monto || monto <= 0) return;

  api('/transacciones', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo, categoria, monto: monto.toFixed(2), descripcion, fecha })
  }).then(() => {
    document.getElementById('formulario').reset();
    document.getElementById('monto').value = '';
    cargarTodo();
  });
});

document.getElementById('tipo').addEventListener('change', () => {
  llenarCategorias(document.getElementById('tipo').value);
});

document.getElementById('filtroTipo').addEventListener('change', renderizar);
document.getElementById('filtroCategoria').addEventListener('change', renderizar);
document.getElementById('filtroBusqueda').addEventListener('input', renderizar);

document.getElementById('btnEliminarTodo').addEventListener('click', () => {
  if (!confirm('Eliminar todas las transacciones?')) return;
  api('/transacciones', { method: 'DELETE' }).then(cargarTodo);
});

document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

document.getElementById('tipo').dispatchEvent(new Event('change'));
cargarTodo();
</script>
</body>
</html>
